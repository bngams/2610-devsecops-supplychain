image: node:24.22.1-trixie-slim

variables:
  EXEC_ONLY:
    value: "osv-scanner"
    options: ["osv-scanner", "npm-audit", "all", "none"]
    description: "Scanner SAST à exécuter"

stages:
  - sast
  - build
  - test

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

build-app:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths: [node_modules/]
    expire_in: 1 hour

unit-test-job:
  stage: test
  needs: [build-app]
  script:
    - npm run test

.sast:
  stage: sast
  cache: []
  allow_failure: true
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
  rules:
    - if: $EXEC_ONLY == $SCANNER || $EXEC_ONLY == "all"

npm-audit:
  extends: .sast
  variables:
    SCANNER: "npm-audit"
  script:
    - npm audit --json | npm-audit-html --output report.html
  artifacts:
    paths: [report.html]

osv-scanner:
  extends: .sast
  image: alpine:edge
  variables:
    SCANNER: "osv-scanner"
  before_script:
    - apk add --no-cache osv-scanner
  script:
    - osv-scanner scan source -r --format html --output-file report-osv.html .
  artifacts:
    paths: [report-osv.html]