# Env container imager
image: 'node:24.22.1-trixie-slim'

cache:
  paths:
    - node_modules/


variables:
  - EXEC_ONLY: "osv-scanner"

stages:          # List of stages for jobs, and their order of execution
  - sast
  - build
  - test
  

build-app:       # This job runs in the build stage, which runs first.
  stage: build
  script:
    - npm install

unit-test-job:   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - npm run test

npm-audit:
  stage: sast
  # In reality: add to dev dependencies
  before_script:
    - npm install -g npm-audit-html
  script:
    - npm audit --json | npm-audit-html --output report.html
  # do not block the pipeline, display a warning 
  allow_failure: true
  # save report
  artifacts:
    when: always
    public: false
    expire_in: 30 days
    paths:
      - "report.html"
  rules:
    - if: '$EXEC_ONLY != null && $EXEC_ONLY == "npm-audit"'
    - when: never

osv-scanner:
  stage: sast
  image: alpine:edge
  before_script:
    # options no-cache...
    - apk add osv-scanner
  script:
    - osv-scanner scan -r --format=html . > report-osv.html
  allow_failure: true
  artifacts:
    when: always
    public: false
    expire_in: 30 days
    paths:
      - "report-osv.html"
  rules:
    - if: '$EXEC_ONLY != null && $EXEC_ONLY == "osv-scanner"'
    - when: never