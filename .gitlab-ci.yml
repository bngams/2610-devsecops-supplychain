image: node:24.22.1-trixie-slim

variables:
  EXEC_ONLY:
    value: "sonar-scanner"
    options: ["osv-scanner", "npm-audit", "sonar-scanner", "all", "none"]
    description: "Scanner SAST à exécuter"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task

stages:
  - sast
  - build
  - test

default:
  cache:
    key:
      files: [package-lock.json]
    paths: [.npm/]

build-app:
  stage: build
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths: [node_modules/]
    expire_in: 1 hour

unit-test-job:
  stage: test
  needs: [build-app]
  script:
    - npm run test

.sast:
  stage: sast
  cache: []
  allow_failure: true
  artifacts:
    when: always
    access: developer
    expire_in: 30 days
  rules:
    - if: $EXEC_ONLY == $SCANNER || $EXEC_ONLY == "all"

npm-audit:
  extends: .sast
  variables:
    SCANNER: "npm-audit"
  script:
    - npm audit --json | npm-audit-html --output report.html
  artifacts:
    paths: [report.html]

osv-scanner:
  extends: .sast
  image: alpine:edge
  variables:
    SCANNER: "osv-scanner"
  before_script:
    - apk add --no-cache osv-scanner
  script:
    - osv-scanner scan source -r --format html --output-file report-osv.html .
  artifacts:
    paths: [report-osv.html]


sonarcloud-check:
  stage: sast
  extends: .sast
  variables:
    SCANNER: "sonar-scanner"
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  # by default sonar free => one branch only 
  # according to QA policy => do not scan all branches
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
